general {
    hide_cursor = true
    ignore_empty_input = true   # pressing Enter on an empty field does nothing
}

# Background: blurred screenshot of the desktop
background {
    monitor =                   # empty = all monitors
    path = screenshot           # or /path/to/wallpaper.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.2
}

# Clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(255, 255, 255, 0.95)
    font_size = 96
    font_family = DejaVuSansMono Nerd Font Mono
    position = 0, 220
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(255, 255, 255, 0.8)
    font_size = 20
    font_family = DejaVuSansMono Nerd Font Mono
    position = 0, 130
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 255, 255, 0.7)
    font_size = 16
    font_family = DejaVuSansMono Nerd Font Mono
    position = 0, -20
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    rounding = 12

    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(30, 30, 46, 0.6)
    font_color = rgb(205, 214, 244)
    check_color = rgb(249, 226, 175)     # border color while checking the password
    fail_color = rgb(243, 139, 168)      # border color on a wrong password

    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -90
    halign = center
    valign = center
}
