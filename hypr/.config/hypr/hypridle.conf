general {
    lock_cmd = pidof hyprlock || hyprlock        # don't start a second hyprlock
    before_sleep_cmd = loginctl lock-session     # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'   # turn the screen back on after resume
}

# Dim the screen after 2.5 min (optional, needs brightnessctl)
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Lock after 5 min
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off after 5.5 min
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Suspend after 30 min (optional)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
